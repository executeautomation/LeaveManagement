name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & web export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub Actions runners as of 2025-09-19;
          # pin to Node 24 (the current LTS line) to silence the warning.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Regenerate gitignored files that `tsc` depends on
      # (`expo-env.d.ts` and `.expo/types/router.d.ts`). Running this with the
      # project's existing `tsconfig.json` is a no-op for the file itself —
      # it exists purely to trigger the side-effect of writing the type files.
      - name: Generate Expo types
        run: npx expo customize tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      - name: Upload web export artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: dist/
          if-no-files-found: error
          retention-days: 7