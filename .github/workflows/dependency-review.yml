name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Audit dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Allow LGPL-family licenses used commonly by RN / Expo deps.
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, CC0-1.0, Unlicense, Python-2.0, BlueOak-1.0.0, 0BSD